<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="landscape" />
    <title>Audio Analyzer - リアルタイム音声解析</title>
    <meta
      name="description"
      content="高性能WebAssemblyベースのリアルタイム音声スペクトラムアナライザー"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- メインキャンバス -->
      <canvas id="visualizer"></canvas>

      <!-- オーバーレイ情報（インタラクティブ） -->
      <div id="infoPanel" class="info-panel hidden">
        <span id="infoFreq">0 Hz</span>
        <span class="separator">|</span>
        <span id="infoDb">-100.0 dB</span>
      </div>

      <!-- コントロールパネル -->
      <div id="controls" class="controls">
        <!-- 折りたたみトグル -->
        <button id="toggleControlsBtn" class="toggle-controls-btn">
          <span class="toggle-icon">▼</span>
        </button>

        <div id="controlsContent" class="controls-content">
          <!-- 左サイドコントロール -->
          <div class="control-group left">
            <button id="startBtn" class="btn btn-primary">
              <span class="icon">▶</span>
              <span class="label">START</span>
            </button>
            <button id="pauseBtn" class="btn btn-secondary hidden">
              <span class="icon">⏸</span>
              <span class="label">PAUSE</span>
            </button>
            <button id="fullscreenBtn" class="btn btn-secondary">
              <span class="icon">⛶</span>
              <span class="label">FULL</span>
            </button>
          </div>

          <!-- 中央コントロール -->
          <div class="control-group center">
            <!-- モード切替 -->
            <div class="mode-selector">
              <button class="mode-btn active" data-mode="bar">BAR</button>
              <button class="mode-btn" data-mode="wave">WAVE</button>
              <button class="mode-btn" data-mode="spectrogram">SPECTRO</button>
            </div>

            <!-- スケール切替 -->
            <div class="scale-selector">
              <button class="scale-btn active" data-scale="log">LOG</button>
              <button class="scale-btn" data-scale="linear">LIN</button>
            </div>
          </div>

          <!-- 右サイドコントロール -->
          <div class="control-group right">
            <!-- ゲインコントロール (数値入力 + AGC) -->
            <div class="gain-control-group">
              <div class="gain-label-row">
                <label>GAIN (dB)</label>
                <button id="agcBtn" class="btn-micro" title="Auto Gain Control">AGC: OFF</button>
              </div>
              <div class="gain-inputs">
                <button id="gainDownBtn" class="gain-btn">-</button>
                <input type="number" id="gainInput" value="0.0" step="1.0" class="gain-number-input">
                <button id="gainUpBtn" class="gain-btn">+</button>
              </div>
            </div>

            <!-- ピークホールド -->
            <div class="peak-control">
              <label class="toggle">
                <input type="checkbox" id="peakHoldToggle" checked />
                <span class="toggle-slider"></span>
                <span class="toggle-label">PEAK</span>
              </label>
              <button id="resetPeakBtn" class="btn btn-small">RESET</button>
            </div>
          </div>
        </div>
      </div>

      <!-- デバッグパネル -->
      <div id="debugPanel" class="debug-panel" style="display:none;">
        <div class="debug-header">
          <span>Debug Log</span>
          <div class="debug-controls">
            <button id="resumeBtn" class="debug-btn" style="background:var(--success);color:white;">Resume</button>
            <button id="copyLogBtn" class="debug-btn">Copy</button>
            <button id="testToneBtn" class="debug-btn">Test Tone</button>
            <button id="clearDebugBtn" class="debug-clear">Clear</button>
          </div>
        </div>
        <div class="debug-options">
          <select id="audioSourceSelect" class="debug-select">
            <option value="">Default Microphone</option>
          </select>
          <div class="debug-checkbox-row">
            <label>
              <input type="checkbox" id="rawModeToggle"> Raw Mode (Disable processing)
            </label>
          </div>
        </div>
        <div id="debugLog" class="debug-log"></div>
      </div>

      <!-- ステータスバー -->
      <div id="status" class="status">
        <span id="sampleRate">48000 Hz</span>
        <span id="fftSize">FFT: 2048</span>
        <span id="fps">0 FPS</span>
      </div>

      <!-- 初期ローディング -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Initializing WebAssembly...</p>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
